<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pc-hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3a1c"/>
      <stop offset="0.55" stop-color="#4a2a17"/>
      <stop offset="1" stop-color="#2b1a10"/>
    </linearGradient>
    <linearGradient id="pc-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d19a4f"/>
      <stop offset="1" stop-color="#a8562b"/>
    </linearGradient>
  </defs>
  <!-- rising hill (price curve) — transparent background, no box -->
  <path d="M8 118 C 8 64, 44 24, 96 24 C 112 24, 122 30, 122 44 L122 118 Z" fill="url(#pc-hill)"/>
  <path d="M8 118 C 8 64, 44 24, 96 24 C 112 24, 122 30, 122 44" fill="none" stroke="url(#pc-rim)" stroke-width="4" stroke-linecap="round"/>
  <!-- twin cast quotes in cream -->
  <g fill="#f3e9d8">
    <path d="M52 58 h14 a4 4 0 0 1 4 4 v12 a14 14 0 0 1 -14 14 h-2 v-7 h2 a7 7 0 0 0 7 -7 h-11 a4 4 0 0 1 -4 -4 v-8 a4 4 0 0 1 4 -4 z"/>
    <path d="M80 58 h14 a4 4 0 0 1 4 4 v12 a14 14 0 0 1 -14 14 h-2 v-7 h2 a7 7 0 0 0 7 -7 h-11 a4 4 0 0 1 -4 -4 v-8 a4 4 0 0 1 4 -4 z"/>
  </g>
  <!-- candle wicks -->
  <path d="M59 47 v8 M87 45 v10" stroke="#d19a4f" stroke-width="3.5" stroke-linecap="round"/>
</svg>
