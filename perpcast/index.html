<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08060f" />
    <title>Perpcast — cast, chat & trade perps</title>
    <meta name="description" content="Perpcast is a social trading network: sign in with your wallet, cast with traders, talk crypto, memes, stocks and RWAs in real time, and open perpetual positions without leaving the conversation." />
    <meta property="og:title" content="Perpcast — cast, chat & trade perps" />
    <meta property="og:description" content="Cast with traders and open perpetual positions on crypto, memes, stocks & RWAs without leaving the conversation." />
    <meta property="og:image" content="https://perpcast.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://perpcast.app" />
    <meta property="og:site_name" content="Perpcast" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Perpcast — cast, chat & trade perps" />
    <meta name="twitter:description" content="Cast with traders and open perpetual positions on crypto, memes, stocks & RWAs without leaving the conversation." />
    <meta name="twitter:image" content="https://perpcast.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const t = localStorage.getItem('perpcast:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <style>
          #splash { display: flex; flex-direction: column; gap: 22px; height: 100dvh; align-items: center; justify-content: center; color: #f3f0fb; font-family: Manrope, Inter, ui-sans-serif, system-ui, sans-serif;
            background: radial-gradient(60% 45% at 10% 0%, rgba(124,92,255,.32), transparent 70%), radial-gradient(45% 40% at 100% 15%, rgba(225,94,242,.18), transparent 70%), #08060f; }
          [data-theme="light"] #splash { color: #15121f; background: radial-gradient(60% 45% at 10% 0%, rgba(124,92,255,.14), transparent 70%), radial-gradient(45% 40% at 100% 15%, rgba(196,69,232,.10), transparent 70%), #fafafb; }
          @keyframes pc-blink { 0%, 8%, 16%, 100% { transform: scaleY(1) } 11%, 13% { transform: scaleY(0.08) } }
          @keyframes pc-breathe { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
          @keyframes pc-in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
          #splash .eye { transform-origin: center; transform-box: fill-box; animation: pc-blink 3.6s ease-in-out infinite; }
          #splash .eye.r { animation-delay: .05s }
          #splash svg { overflow: visible; animation: pc-breathe 3.2s ease-in-out infinite; filter: drop-shadow(0 24px 40px rgba(124, 92, 255, 0.45)); }
          #splash .wm { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; animation: pc-in 0.6s ease-out both; }
          #splash .wm b { background: linear-gradient(120deg, #9b7dff, #e15ef2 55%, #ff8a5c); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800 }
          #splash.out { transition: opacity .35s ease; opacity: 0; pointer-events: none }
        </style>
        <svg viewBox="0 0 128 128" width="152" height="152" aria-hidden="true">
          <defs>
            <linearGradient id="s-box" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7b6ff"/><stop offset=".5" stop-color="#e9a8ff"/><stop offset="1" stop-color="#ffb08a"/></linearGradient>
            <linearGradient id="s-hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1e4d"/><stop offset="1" stop-color="#0a0713"/></linearGradient>
            <clipPath id="s-clip"><rect width="128" height="128" rx="32"/></clipPath>
          </defs>
          <rect width="128" height="128" rx="32" fill="url(#s-box)"/>
          <g clip-path="url(#s-clip)">
            <path d="M-6 104 C 10 56, 44 26, 90 28 C 114 30, 130 44, 136 60 L136 136 L-6 136 Z" fill="url(#s-hill)"/>
          </g>
          <g class="eye l"><rect x="42" y="50" width="18" height="26" rx="8" fill="#fff"/><circle cx="52.5" cy="66" r="3.4" fill="#0a0713"/></g>
          <g class="eye r"><rect x="70" y="50" width="18" height="26" rx="8" fill="#fff"/><circle cx="80.5" cy="66" r="3.4" fill="#0a0713"/></g>
        </svg>
        <div class="wm">Perp<b>cast</b></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
