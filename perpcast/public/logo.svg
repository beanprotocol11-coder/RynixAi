<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pc-box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7b6ff"/>
      <stop offset="0.5" stop-color="#e9a8ff"/>
      <stop offset="1" stop-color="#ffb08a"/>
    </linearGradient>
    <linearGradient id="pc-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1e4d"/>
      <stop offset="1" stop-color="#0a0713"/>
    </linearGradient>
    <clipPath id="pc-clip"><rect width="128" height="128" rx="32"/></clipPath>
    <style>
      @keyframes pc-blink { 0%, 8%, 16%, 100% { transform: scaleY(1) } 11%, 13% { transform: scaleY(0.08) } }
      .eye { transform-origin: center; transform-box: fill-box; animation: pc-blink 3.6s ease-in-out infinite; }
      .eye.r { animation-delay: .05s }
      @media (prefers-reduced-motion: reduce) { .eye { animation: none } }
    </style>
  </defs>
  <rect width="128" height="128" rx="32" fill="url(#pc-box)"/>
  <g clip-path="url(#pc-clip)">
    <path d="M-6 104 C 10 56, 44 26, 90 28 C 114 30, 130 44, 136 60 L136 136 L-6 136 Z" fill="url(#pc-hill)"/>
  </g>
  <g class="eye l">
    <rect x="42" y="50" width="18" height="26" rx="8" fill="#ffffff"/>
    <circle cx="52.5" cy="66" r="3.4" fill="#0a0713"/>
  </g>
  <g class="eye r">
    <rect x="70" y="50" width="18" height="26" rx="8" fill="#ffffff"/>
    <circle cx="80.5" cy="66" r="3.4" fill="#0a0713"/>
  </g>
</svg>
