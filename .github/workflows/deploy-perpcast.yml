name: Deploy Perpcast to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'perpcast/**'
      - '.github/workflows/deploy-perpcast.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-perpcast
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy perpcast
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5d03731e12b93ff46e23c27165d1421c
    defaults:
      run:
        working-directory: perpcast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: perpcast/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4.86.0 pages deploy dist --project-name perpcast --branch main
